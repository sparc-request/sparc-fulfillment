name: cwf ci

on:
  push:
    branches:
      - "v*"
  pull_request:
    branches:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rspec_files:
          - "spec/api spec/controllers spec/helpers spec/jobs spec/lib spec/models spec/requests"
          - "spec/features"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_ROOT_PASSWORD: ''
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      RAILS_ENV: test
      TZ: America/New_York
      DISPLAY: :99.0
      MOZ_HEADLESS: 1
      DATABASE_HOST: 127.0.0.1
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ''
      DATABASE_NAME: cwf_test
      SPARC_DATABASE_NAME: test_sparc_request
      USE_EPIC: "true"
      EPIC_TEST_MODE: "true"

    steps:
      - name: Checkout sparc-fulfillment
        uses: actions/checkout@v4
        with:
          path: sparc-fulfillment

      - name: Checkout sparc-request
        uses: actions/checkout@v4
        with:
          repository: sparc-request/sparc-request
          ref: v3.14.0
          path: sparc-request

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 14.19.2

      - name: Install firefox
        uses: browser-actions/setup-firefox@latest
        with:
          firefox-version: '140.0.4'

      - name: Install system dependencies and start Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mysql-client libcurl4-openssl-dev
          Xvfb :99 -screen 0 1024x768x24 &

      # Setup sparc-request DB first (Dependency)
      - name: Set up ruby for sparc-request
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./sparc-request
          bundler-cache: true

      - name: Create databases
        run: |
          mysql -h $DATABASE_HOST -u $DATABASE_USERNAME -e "create database $DATABASE_NAME;"
          mysql -h $DATABASE_HOST -u $DATABASE_USERNAME -e "create database $SPARC_DATABASE_NAME;"

      - name: Setup sparc-request database
        working-directory: ./sparc-request
        env:
          DATABASE_NAME: ${{ env.SPARC_DATABASE_NAME }}
        run: |
          cp config/database.yml.example config/database.yml
          cp config/fulfillment_db.yml.example config/fulfillment_db.yml
          cp dotenv.example .env
          bundle exec rake db:migrate
          bundle exec rake db:test:prepare

      - name: Set up ruby for sparc-fulfillment
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./sparc-fulfillment
          bundler-cache: true

      - name: Set up sparc-fulfillment database
        working-directory: ./sparc-fulfillment
        run: |
          mkdir -p tmp
          cp config/database.yml.example config/database.yml
          cp config/sparc_db.yml.example config/sparc_db.yml
          cp config/klok_db.yml.example config/klok_db.yml
          cp dotenv.example .env
          bundle exec rake db:migrate

      - name: Install Node dependencies and precompile assets
        working-directory: ./sparc-fulfillment
        run: |
          npm install -g yarn
          yarn install
          bundle exec rake assets:precompile

      - name: Run RSpec tests
        working-directory: ./sparc-fulfillment
        run: |
          bundle exec rspec ${{ matrix.rspec_files }}
